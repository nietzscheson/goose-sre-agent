[project]
name = "goose-sre-agent"
version = "0.1.0"
description = "block/goose as an SRE AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "awslabs-cloudwatch-mcp-server>=0.0.14",
    "awslabs-well-architected-security-mcp-server>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
src = { path = "src" }
